[project]
name = 'wahu'
version = '0.1.0'
description = '外呼系统：名单、任务、坐席工作台、模拟外呼、CRM 回写与报表'
requires-python = '>=3.11'
dependencies = [
    'fastapi>=0.115',
    'uvicorn[standard]>=0.30',
    'pydantic>=2.7',
    'pydantic-settings>=2.3',
    'SQLAlchemy>=2.0',
    'python-multipart>=0.0.9',
    'httpx>=0.27',
    'openpyxl>=3.1',
    'psycopg[binary]>=3.1',
]

[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ['app*']